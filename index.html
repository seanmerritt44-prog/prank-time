<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Security Awareness</title>

<style>
body{
    margin:0;
    background:#0b0b0b;
    color:#00ff66;
    font-family:Consolas, monospace;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

#terminal{
    text-align:center;
    max-width:700px;
}

img{
    display:none;
    max-width:80%;
    border-radius:15px;
    box-shadow:0 0 30px #00ff66;
}

.hidden{
    display:none;
}

h1{
    color:#00ff66;
}

p{
    font-size:20px;
}
</style>
</head>

<body>

<div id="terminal">
<h1>⚠ Security Awareness Check ⚠</h1>

<p id="text">
Verifying suspicious link...
</p>

</div>

<img id="photo" src="photo.png">

<script>

const text=document.getElementById("text");

setTimeout(()=>{
text.innerHTML="Scanning...";
},1500);

setTimeout(()=>{
text.innerHTML="No malware detected...";
},3000);

setTimeout(()=>{
text.innerHTML="<strong>You clicked a random link.</strong><br><br>Always verify links before clicking.<br><br>😂";
},4500);

setTimeout(()=>{
document.getElementById("terminal").style.display="none";
document.getElementById("photo").style.display="block";
},7000);

</script>

</body>
</html>
